# Builds and tests circles on Apple silicon. For a version tag (v*), also
# publishes a release with the app, signed ad hoc, zipped.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: make build
      - run: make test
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --keepParent build/circles.app circles-macos.zip
          gh release create "$GITHUB_REF_NAME" circles-macos.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
