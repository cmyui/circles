# Builds and tests circles on Apple silicon. For a version tag (v*), also
# puts the app, signed ad hoc, zipped, on that tag's release: the one
# published in GitHub's UI, which made the tag, or else a new one.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: make build
      - run: make test
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --keepParent build/circles.app circles-macos.zip
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" circles-macos.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" circles-macos.zip \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
